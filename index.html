<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2026 久違了~ 聖誕交換禮物大會</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #123829 0%, #091f16 100%);
      color: #f8f6f0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .card-ivory {
      background: #fcfaf5;
      color: #1c2822;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }
    .btn-press:active { transform: scale(0.97); }
    @keyframes shake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-6deg); }
      40% { transform: rotate(6deg); }
      60% { transform: rotate(-4deg); }
      80% { transform: rotate(4deg); }
    }
    .animate-shake { animation: shake 0.45s ease-in-out; }
    #wheelCanvas {
      transition: transform 3.4s cubic-bezier(0.15, 0.85, 0.2, 1);
    }
  </style>
</head>
<body class="pb-16">

  <!-- 頂部標題列 -->
  <header class="sticky top-0 z-30 backdrop-blur-md bg-[#0b261b]/90 border-b border-[#d4af37]/30 px-4 py-3.5">
    <div class="max-w-lg mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <h1 class="text-lg sm:text-xl font-black tracking-wide text-[#f7e7b4] truncate">
          2026 久違了 聖誕交換禮物大會
        </h1>
        <button id="hostTriggerBtn" title="主辦人主控台" class="text-base opacity-75 hover:opacity-100 active:scale-125 transition p-1 select-none">
          🌲
        </button>
      </div>
      <button id="qrOpenBtn" class="shrink-0 text-xs font-bold px-3 py-1.5 rounded-full bg-[#d4af37]/20 text-[#f7e7b4] border border-[#d4af37]/50 btn-press">
        現場 QR
      </button>
    </div>

    <!-- 目前階段進度條 -->
    <div class="max-w-lg mx-auto mt-2.5 flex items-center justify-between text-xs bg-black/30 rounded-xl px-3 py-2 border border-white/10">
      <span id="phaseBadge" class="font-bold text-[#f7e7b4]">階段 0｜轉盤抽禮物編號</span>
      <span id="statusCounter" class="text-emerald-200/80">剩餘 20 個號碼</span>
    </div>
  </header>

  <!-- 隱藏式主辦人主控台（密碼 1234） -->
  <section id="hostPanel" class="hidden max-w-lg mx-auto px-4 pt-3">
    <div class="rounded-2xl bg-[#163d2d] border-2 border-[#d4af37] p-4 shadow-2xl space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-sm font-black text-[#f7e7b4]">👑 主辦人主控台</span>
        <button id="hostCloseBtn" class="text-xs text-emerald-200 underline">收起</button>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <button data-set-phase="0" class="phase-switch-btn py-2.5 px-2.5 rounded-xl text-xs font-bold border border-white/20 text-left">
          0️⃣ 轉盤抽自己編號
        </button>
        <button data-set-phase="1" class="phase-switch-btn py-2.5 px-2.5 rounded-xl text-xs font-bold border border-white/20 text-left">
          1️⃣ 填寫禮物提示
        </button>
        <button data-set-phase="2" class="phase-switch-btn py-2.5 px-2.5 rounded-xl text-xs font-bold border border-white/20 text-left">
          2️⃣ 電子籤筒抽禮物
        </button>
        <button data-set-phase="3" class="phase-switch-btn py-2.5 px-2.5 rounded-xl text-xs font-bold border border-white/20 text-left">
          3️⃣ 大開箱登記禮物
        </button>
        <button data-set-phase="4" class="phase-switch-btn col-span-2 py-2.5 px-2.5 rounded-xl text-xs font-bold border border-white/20 text-left">
          4️⃣ 不記名投最爛禮物
        </button>
      </div>
      <div class="pt-1 border-t border-white/15">
        <button id="revealToggleBtn" class="w-full py-3 rounded-xl bg-gradient-to-r from-[#b91c1c] to-[#991b1b] text-white text-sm font-black shadow btn-press">
          🏆 正式開票揭曉
        </button>
      </div>
    </div>
  </section>

  <main class="max-w-lg mx-auto px-4 pt-4 space-y-4">

    <!-- 【階段 0 專屬】轉盤抽禮物編號（號碼絕不重複） -->
    <section id="wheelSection" class="space-y-4">
      <div class="card-ivory rounded-3xl p-5 border-2 border-[#d4af37] text-center space-y-4">
        <div>
          <h2 class="text-xl font-black text-emerald-950">轉出你的禮物編號</h2>
          <p class="text-xs text-stone-500 mt-1">已抽出的號碼會自動移除，絕不重複</p>
        </div>

        <!-- 轉盤容器 -->
        <div class="relative w-72 h-72 mx-auto flex items-center justify-center">
          <!-- 頂部金色指針 -->
          <div class="absolute -top-2.5 z-20 w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-t-[24px] border-t-[#b91c1c] drop-shadow"></div>
          <canvas id="wheelCanvas" width="288" height="288" class="rounded-full shadow-xl border-4 border-[#d4af37]"></canvas>
          <button id="spinWheelBtn" class="absolute z-10 w-16 h-16 rounded-full bg-emerald-950 text-[#f7e7b4] border-2 border-[#d4af37] font-black text-sm shadow-lg btn-press flex items-center justify-center">
            開始轉
          </button>
        </div>

        <!-- 轉盤結果顯示 -->
        <div id="wheelResultBox" class="hidden p-4 rounded-2xl bg-emerald-950 text-[#f7e7b4] space-y-2">
          <p class="text-xs opacity-80">你的專屬禮物編號</p>
          <p id="wheelWonNumber" class="text-4xl font-black tracking-wider">#01</p>
          <button id="goFillHintBtn" class="w-full mt-2 py-2.5 rounded-xl bg-[#d4af37] text-emerald-950 font-black text-sm btn-press">
            前往填寫禮物提示
          </button>
        </div>
      </div>

      <!-- 已抽出號碼一覽 -->
      <div class="rounded-2xl bg-black/25 border border-white/10 p-3.5 text-center space-y-2">
        <p id="wheelPoolText" class="text-xs text-emerald-200 font-bold">目前還有 20 個號碼可抽</p>
        <div id="assignedChips" class="flex flex-wrap justify-center gap-1.5"></div>
      </div>
    </section>

    <!-- 【階段 2 專屬】電子籤筒抽禮物 -->
    <section id="lotterySection" class="hidden space-y-4">
      <div class="card-ivory rounded-3xl p-5 border-2 border-[#d4af37] text-center space-y-4">
        <div class="inline-block px-3 py-1 rounded-full bg-emerald-900/10 text-emerald-900 text-xs font-bold">
          每人限重抽 1 次
        </div>

        <div id="lotteryIdleBox" class="space-y-4 py-2">
          <div class="text-5xl" id="shakerIcon">🎋</div>
          <div>
            <h2 class="text-xl font-black text-emerald-950">輪到你抽禮物囉！</h2>
            <p class="text-sm text-stone-600 mt-1">按下按鈕抽出一句禮物提示</p>
          </div>
          <button id="drawTicketBtn" class="w-full py-4 rounded-2xl bg-gradient-to-r from-[#14532d] to-[#0f3d21] text-[#f7e7b4] text-lg font-black shadow-lg btn-press">
            🎲 搖一搖抽一支籤
          </button>
        </div>

        <div id="lotteryDecisionBox" class="hidden space-y-4 py-2">
          <p class="text-xs font-bold uppercase tracking-wider text-amber-700">抽到的禮物提示</p>
          <div class="p-5 rounded-2xl bg-amber-50 border-2 border-dashed border-amber-400">
            <p id="drawnHintText" class="text-2xl font-black text-stone-900 leading-snug"></p>
          </div>
          <p id="redrawChanceLabel" class="text-xs font-bold text-stone-500">還有 1 次丟回重抽的機會</p>
          <div class="grid grid-cols-2 gap-3 pt-1">
            <button id="redrawBtn" class="py-3.5 px-3 rounded-2xl bg-stone-200 text-stone-800 font-black text-sm btn-press">
              🔄 丟回重抽
            </button>
            <button id="confirmTicketBtn" class="py-3.5 px-3 rounded-2xl bg-[#b91c1c] text-white font-black text-sm shadow-md btn-press">
              ✨ 就決定是它！
            </button>
          </div>
        </div>

        <div id="lotteryResultBox" class="hidden space-y-3 py-2">
          <p class="text-sm font-bold text-emerald-800">🎉 抽籤完成！請領取禮物</p>
          <div class="py-4 px-6 rounded-2xl bg-emerald-950 text-[#f7e7b4] inline-block">
            <span class="text-xs block opacity-80">禮物編號</span>
            <span id="finalWonNumber" class="text-4xl font-black tracking-wider">#07</span>
          </div>
          <p id="finalWonHint" class="text-sm font-bold text-stone-600"></p>
          <div class="pt-2">
            <button id="nextPersonDrawBtn" class="w-full py-3 rounded-2xl bg-emerald-800 text-white font-black text-sm shadow btn-press">
              ➡️ 換下一位抽籤
            </button>
          </div>
        </div>
      </div>

      <div class="rounded-2xl bg-black/25 border border-white/10 p-3.5 text-center">
        <p id="poolRemainText" class="text-xs text-emerald-200 font-medium">籤筒裡目前還有 20 支未抽出的籤</p>
      </div>
    </section>

    <!-- 【正式開票結果看板】 -->
    <section id="resultBanner" class="hidden rounded-3xl bg-gradient-to-b from-[#7f1d1d] to-[#450a0a] border-2 border-[#f7e7b4] p-5 text-center shadow-2xl space-y-3">
      <div class="text-3xl">👑🧋</div>
      <h2 class="text-xl sm:text-2xl font-black text-[#f7e7b4] leading-snug">
        本屆最爛禮物大苦主<br/>
        <span class="text-red-200">（請全場喝飲料）</span>
      </h2>
      <div id="loserList" class="space-y-2 pt-1"></div>
    </section>

    <!-- 20 號禮物大卡片清單（階段 1、3、4 顯示） -->
    <section id="cardsGrid" class="space-y-3"></section>

  </main>

  <!-- 填寫 / 編輯彈窗 -->
  <div id="editModal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
    <div class="card-ivory w-full max-w-md rounded-3xl p-5 space-y-4">
      <div class="flex items-center justify-between border-b border-stone-200 pb-3">
        <h3 id="modalTitle" class="text-xl font-black text-emerald-950">#01 號禮物</h3>
        <button id="modalCloseBtn" class="w-8 h-8 rounded-full bg-stone-200 text-stone-700 font-bold">✕</button>
      </div>

      <!-- 階段 1 欄位 -->
      <div id="modalPhase1Fields" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-stone-600 mb-1">誰送的？</label>
          <input id="inputGiver" type="text" placeholder="輸入你的名字" class="w-full px-4 py-3 rounded-xl border-2 border-stone-300 focus:border-emerald-700 focus:outline-none text-base font-bold bg-white" />
        </div>
        <div>
          <label class="block text-xs font-bold text-stone-600 mb-1">禮物提示</label>
          <input id="inputHint" type="text" placeholder="輸入禮物提示" class="w-full px-4 py-3 rounded-xl border-2 border-stone-300 focus:border-emerald-700 focus:outline-none text-base font-bold bg-white" />
        </div>
      </div>

      <!-- 階段 3 欄位 -->
      <div id="modalPhase3Fields" class="hidden space-y-3">
        <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-xs text-emerald-900 font-bold">
          禮物提示：<span id="modalHintPreview"></span>
        </div>
        <div>
          <label class="block text-xs font-bold text-stone-600 mb-1">送禮人</label>
          <input id="inputGiverEdit" type="text" placeholder="輸入你的名字" class="w-full px-4 py-3 rounded-xl border-2 border-stone-300 focus:border-emerald-700 focus:outline-none text-base font-bold bg-white" />
        </div>
        <div>
          <label class="block text-xs font-bold text-stone-600 mb-1">拆開是什麼禮物？</label>
          <input id="inputGiftName" type="text" placeholder="輸入禮物名稱" class="w-full px-4 py-3 rounded-xl border-2 border-stone-300 focus:border-emerald-700 focus:outline-none text-base font-bold bg-white" />
        </div>
      </div>

      <button id="modalSaveBtn" class="w-full py-3.5 rounded-2xl bg-[#14532d] text-[#f7e7b4] font-black text-base shadow-lg btn-press">
        儲存
      </button>
    </div>
  </div>

  <!-- 密碼解鎖小視窗 -->
  <div id="pwdModal" class="hidden fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
    <div class="card-ivory w-full max-w-xs rounded-3xl p-5 space-y-4 text-center">
      <div class="text-3xl">🌲</div>
      <h3 class="text-lg font-black text-emerald-950">輸入主辦人密碼</h3>
      <input id="pwdInput" type="password" inputmode="numeric" maxlength="6" placeholder="請輸入密碼" class="w-full text-center tracking-widest text-xl font-black px-4 py-3 rounded-xl border-2 border-stone-300 focus:border-emerald-700 focus:outline-none bg-white" />
      <div class="grid grid-cols-2 gap-2">
        <button id="pwdCancelBtn" class="py-2.5 rounded-xl bg-stone-200 text-stone-700 font-bold text-sm">取消</button>
        <button id="pwdConfirmBtn" class="py-2.5 rounded-xl bg-[#14532d] text-[#f7e7b4] font-bold text-sm">解鎖</button>
      </div>
    </div>
  </div>

  <!-- 現場 QR Code 視窗 -->
  <div id="qrModal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
    <div class="card-ivory w-full max-w-xs rounded-3xl p-5 text-center space-y-4">
      <h3 class="text-lg font-black text-emerald-950">掃碼加入交換禮物</h3>
      <div class="bg-white p-3 rounded-2xl inline-block border border-stone-200">
        <img id="qrImg" src="" alt="QR Code" class="w-48 h-48 mx-auto" />
      </div>
      <button id="copyUrlBtn" class="w-full py-3 rounded-xl bg-[#14532d] text-[#f7e7b4] font-bold text-sm btn-press">
        複製網址
      </button>
      <button id="qrCloseBtn" class="w-full py-2 text-xs text-stone-500 font-bold">關閉</button>
    </div>
  </div>

  <script>
    const TOTAL_SLOTS = 20;
    const HOST_PWD = "1234";

    function createInitialSlots() {
      const slots = {};
      for (let i = 1; i <= TOTAL_SLOTS; i++) {
        const key = String(i).padStart(2, '0');
        slots[key] = {
          id: key,
          assigned: false,
          giver: "",
          hint: "",
          gift: "",
          drawn: false,
          votes: 0
        };
      }
      return slots;
    }

    let state = {
      phase: 0, // 0: 轉盤抽自己編號, 1: 填寫禮物提示, 2: 電子籤筒抽禮物, 3: 大開箱登記禮物, 4: 不記名投票
      revealed: false,
      slots: createInitialSlots()
    };

    let currentEditId = null;
    let tempCandidateSlotId = null;
    let currentTurnRedrawUsed = false;
    let currentTurnWonId = null;

    // 轉盤相關狀態
    let isSpinning = false;
    let currentRotation = 0;
    let lastWheelWonId = null;

    function loadState() {
      const saved = localStorage.getItem("xmas2026_v3_state");
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          state.phase = parsed.phase !== undefined ? parsed.phase : 0;
          state.revealed = !!parsed.revealed;
          state.slots = { ...createInitialSlots(), ...(parsed.slots || {}) };
        } catch (e) {}
      }
      renderAll();
    }

    function saveState() {
      localStorage.setItem("xmas2026_v3_state", JSON.stringify(state));
      renderAll();
    }

    function renderAll() {
      const phaseLabels = {
        0: "階段 0｜轉盤抽禮物編號",
        1: "階段 1｜填寫禮物提示",
        2: "階段 2｜電子籤筒抽禮物",
        3: "階段 3｜大開箱登記禮物",
        4: "階段 4｜不記名投最爛禮物"
      };
      document.getElementById("phaseBadge").textContent = phaseLabels[state.phase];

      const slotArr = Object.values(state.slots).sort((a, b) => a.id.localeCompare(b.id));
      if (state.phase === 0) {
        const remainNums = slotArr.filter(s => !s.assigned).length;
        document.getElementById("statusCounter").textContent = `剩餘 ${remainNums} 個號碼`;
      } else if (state.phase === 1) {
        const done = slotArr.filter(s => s.hint && s.giver).length;
        document.getElementById("statusCounter").textContent = `已投籤 ${done} / ${TOTAL_SLOTS}`;
      } else if (state.phase === 2) {
        const drawnCount = slotArr.filter(s => s.drawn).length;
        document.getElementById("statusCounter").textContent = `已抽出 ${drawnCount} / ${TOTAL_SLOTS}`;
      } else if (state.phase === 3) {
        const opened = slotArr.filter(s => s.gift).length;
        document.getElementById("statusCounter").textContent = `已開箱 ${opened} / ${TOTAL_SLOTS}`;
      } else {
        const totalVotes = slotArr.reduce((acc, s) => acc + (s.votes || 0), 0);
        document.getElementById("statusCounter").textContent = `已投票 ${totalVotes} 票`;
      }

      document.querySelectorAll(".phase-switch-btn").forEach(btn => {
        const p = Number(btn.dataset.setPhase);
        if (p === state.phase) {
          btn.classList.add("bg-[#d4af37]", "text-emerald-950", "border-[#d4af37]");
          btn.classList.remove("text-white");
        } else {
          btn.classList.remove("bg-[#d4af37]", "text-emerald-950", "border-[#d4af37]");
          btn.classList.add("text-white");
        }
      });

      const wheelSection = document.getElementById("wheelSection");
      const lotterySection = document.getElementById("lotterySection");
      const cardsGrid = document.getElementById("cardsGrid");
      const resultBanner = document.getElementById("resultBanner");

      wheelSection.classList.add("hidden");
      lotterySection.classList.add("hidden");
      cardsGrid.classList.add("hidden");

      if (state.phase === 0) {
        wheelSection.classList.remove("hidden");
        renderWheelSection(slotArr);
      } else if (state.phase === 2) {
        lotterySection.classList.remove("hidden");
        renderLotteryView(slotArr);
      } else {
        cardsGrid.classList.remove("hidden");
        renderCardsGrid(slotArr);
      }

      if (state.revealed) {
        resultBanner.classList.remove("hidden");
        renderLoserBanner(slotArr);
      } else {
        resultBanner.classList.add("hidden");
      }
    }

    // 繪製轉盤（僅顯示尚未被抽走的號碼，確保絕不重複）
    function drawWheelCanvas(availableSlots) {
      const canvas = document.getElementById("wheelCanvas");
      const ctx = canvas.getContext("2d");
      const size = canvas.width;
      const center = size / 2;
      const radius = center - 4;

      ctx.clearRect(0, 0, size, size);

      if (availableSlots.length === 0) {
        ctx.fillStyle = "#14532d";
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#f7e7b4";
        ctx.font = "900 18px 'Noto Sans TC', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("全部號碼已抽完", center, center);
        return;
      }

      const sliceAngle = (Math.PI * 2) / availableSlots.length;
      const colors = ["#14532d", "#991b1b", "#1e3a2f", "#b45309"];

      availableSlots.forEach((slot, i) => {
        const startAngle = i * sliceAngle - Math.PI / 2;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.strokeStyle = "rgba(247, 231, 180, 0.35)";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 繪製號碼文字
        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#fcfaf5";
        ctx.font = availableSlots.length > 12 ? "900 14px 'Noto Sans TC', sans-serif" : "900 18px 'Noto Sans TC', sans-serif";
        ctx.fillText(`#${slot.id}`, radius - 16, 0);
        ctx.restore();
      });
    }

    function renderWheelSection(slotArr) {
      const available = slotArr.filter(s => !s.assigned);
      drawWheelCanvas(available);

      document.getElementById("wheelPoolText").textContent =
        available.length > 0 ? `目前還有 ${available.length} 個號碼可抽` : "20 個號碼已全數分配完畢";

      const assignedList = slotArr.filter(s => s.assigned);
      document.getElementById("assignedChips").innerHTML = assignedList.map(s => `
        <span class="px-2.5 py-1 rounded-lg bg-white/10 text-[#f7e7b4] text-xs font-bold">
          #${s.id}${s.giver ? ` (${escapeHtml(s.giver)})` : ''}
        </span>
      `).join("");

      const resBox = document.getElementById("wheelResultBox");
      if (lastWheelWonId) {
        resBox.classList.remove("hidden");
        document.getElementById("wheelWonNumber").textContent = `#${lastWheelWonId}`;
      } else {
        resBox.classList.add("hidden");
      }
    }

    // 轉盤啟動按鈕
    document.getElementById("spinWheelBtn").addEventListener("click", () => {
      if (isSpinning) return;
      const available = Object.values(state.slots)
        .filter(s => !s.assigned)
        .sort((a, b) => a.id.localeCompare(b.id));

      if (available.length === 0) {
        alert("所有號碼都已經抽完囉！");
        return;
      }

      isSpinning = true;
      lastWheelWonId = null;
      document.getElementById("wheelResultBox").classList.add("hidden");

      const targetIndex = Math.floor(Math.random() * available.length);
      const targetSlot = available[targetIndex];
      const sliceDeg = 360 / available.length;

      // 計算讓指針（正上方 0 度）精準停在 targetIndex 扇形中央的旋轉角度
      const targetCenterDeg = targetIndex * sliceDeg + sliceDeg / 2;
      const stopAngle = (360 - targetCenterDeg) % 360;
      const extraSpins = 360 * 5;
      const currentMod = currentRotation % 360;
      const delta = (stopAngle - currentMod + 360) % 360;
      currentRotation += extraSpins + delta;

      const canvas = document.getElementById("wheelCanvas");
      canvas.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        isSpinning = false;
        state.slots[targetSlot.id].assigned = true;
        lastWheelWonId = targetSlot.id;
        // 重置轉盤視覺角度以對應新的剩餘扇形數量
        canvas.style.transition = "none";
        currentRotation = 0;
        canvas.style.transform = "rotate(0deg)";
        void canvas.offsetWidth;
        canvas.style.transition = "transform 3.4s cubic-bezier(0.15, 0.85, 0.2, 1)";
        saveState();
      }, 3450);
    });

    // 抽到號碼後直接前往填寫禮物提示
    document.getElementById("goFillHintBtn").addEventListener("click", () => {
      if (!lastWheelWonId) return;
      const targetId = lastWheelWonId;
      lastWheelWonId = null;
      window.openEditModal(targetId, true);
    });

    function renderLotteryView(slotArr) {
      const remaining = slotArr.filter(s => !s.drawn);
      document.getElementById("poolRemainText").textContent = `籤筒裡目前還有 ${remaining.length} 支未抽出的籤`;

      const idleBox = document.getElementById("lotteryIdleBox");
      const decisionBox = document.getElementById("lotteryDecisionBox");
      const resultBox = document.getElementById("lotteryResultBox");

      if (currentTurnWonId && state.slots[currentTurnWonId]) {
        idleBox.classList.add("hidden");
        decisionBox.classList.add("hidden");
        resultBox.classList.remove("hidden");
        document.getElementById("finalWonNumber").textContent = `#${currentTurnWonId}`;
        document.getElementById("finalWonHint").textContent = `提示：「${state.slots[currentTurnWonId].hint || '神祕禮物'}」`;
      } else if (tempCandidateSlotId && state.slots[tempCandidateSlotId]) {
        idleBox.classList.add("hidden");
        decisionBox.classList.remove("hidden");
        resultBox.classList.add("hidden");
        document.getElementById("drawnHintText").textContent = `「${state.slots[tempCandidateSlotId].hint || '未填寫提示'}」`;
        const redrawBtn = document.getElementById("redrawBtn");
        if (currentTurnRedrawUsed || remaining.length <= 1) {
          redrawBtn.disabled = true;
          redrawBtn.classList.add("opacity-40");
          document.getElementById("redrawChanceLabel").textContent = "已無重抽機會";
        } else {
          redrawBtn.disabled = false;
          redrawBtn.classList.remove("opacity-40");
          document.getElementById("redrawChanceLabel").textContent = "還有 1 次丟回重抽的機會";
        }
      } else {
        idleBox.classList.remove("hidden");
        decisionBox.classList.add("hidden");
        resultBox.classList.add("hidden");
      }
    }

    function renderCardsGrid(slotArr) {
      const container = document.getElementById("cardsGrid");

      container.innerHTML = slotArr.map(slot => {
        if (state.phase === 1) {
          const isReady = Boolean(slot.giver && slot.hint);
          return `
            <div onclick="window.openEditModal('${slot.id}')" class="card-ivory rounded-2xl p-4 flex items-center justify-between gap-3 cursor-pointer btn-press border-2 ${isReady ? 'border-emerald-600' : 'border-transparent'}">
              <div class="flex items-center gap-3.5 min-w-0">
                <span class="w-12 h-12 rounded-xl bg-emerald-950 text-[#f7e7b4] font-black text-lg flex items-center justify-center shrink-0">
                  #${slot.id}
                </span>
                <div class="min-w-0">
                  <p class="font-black text-base text-emerald-950 truncate">
                    ${isReady ? '🔒 已完成投籤' : '尚未投籤'}
                  </p>
                </div>
              </div>
              <span class="shrink-0 text-xs font-bold px-3.5 py-2 rounded-xl ${isReady ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-900'}">
                ${isReady ? '已鎖定' : '填寫'}
              </span>
            </div>
          `;
        }

        const hasGift = Boolean(slot.gift);
        return `
          <div class="card-ivory rounded-2xl p-4 space-y-3">
            <div class="flex items-start justify-between gap-3">
              <div class="flex items-start gap-3 min-w-0">
                <span class="w-12 h-12 rounded-xl bg-emerald-950 text-[#f7e7b4] font-black text-lg flex items-center justify-center shrink-0 mt-0.5">
                  #${slot.id}
                </span>
                <div class="min-w-0">
                  <span class="inline-block text-xs font-bold px-2 py-0.5 rounded bg-stone-200 text-stone-700 mb-1">
                    誰送：${slot.giver ? escapeHtml(slot.giver) : '尚未填寫'}
                  </span>
                  <h3 class="text-lg font-black text-stone-900 leading-snug break-words">
                    ${hasGift ? escapeHtml(slot.gift) : '<span class="text-stone-400 font-bold">尚未登錄禮物</span>'}
                  </h3>
                </div>
              </div>

              ${state.phase === 3 ? `
                <button onclick="window.openEditModal('${slot.id}')" class="shrink-0 text-xs font-bold px-3.5 py-2 rounded-xl bg-emerald-900 text-[#f7e7b4] btn-press">
                  ${hasGift ? '修改' : '填寫'}
                </button>
              ` : ''}
            </div>

            ${state.phase === 4 ? `
              <div class="pt-2 border-t border-stone-200 flex items-center justify-between gap-2">
                <span class="text-xs font-bold text-stone-500">
                  ${state.revealed ? `獲得 ${slot.votes || 0} 票` : '不記名投票'}
                </span>
                ${!state.revealed ? `
                  <button onclick="window.castVote('${slot.id}')" class="px-4 py-2 rounded-xl text-xs font-black bg-gradient-to-r from-[#b91c1c] to-[#991b1b] text-white shadow btn-press">
                    👎 投它最爛！
                  </button>
                ` : ''}
              </div>
            ` : ''}
          </div>
        `;
      }).join("");
    }

    function renderLoserBanner(slotArr) {
      const maxVotes = Math.max(...slotArr.map(s => s.votes || 0));
      const loserBox = document.getElementById("loserList");
      if (maxVotes <= 0) {
        loserBox.innerHTML = `<p class="text-sm text-red-100">目前尚無投票紀錄</p>`;
        return;
      }
      const losers = slotArr.filter(s => (s.votes || 0) === maxVotes);
      loserBox.innerHTML = losers.map(l => `
        <div class="bg-black/35 rounded-2xl p-3.5 border border-[#f7e7b4]/40">
          <div class="text-base font-black text-[#f7e7b4]">
            #${l.id}｜${escapeHtml(l.giver || '神秘送禮人')}（${l.votes} 票）
          </div>
          <div class="text-sm font-bold text-white mt-0.5">
            禮物：${escapeHtml(l.gift || '未填寫')}
          </div>
        </div>
      `).join("");
    }

    window.openEditModal = function(id, forceHintMode = false) {
      currentEditId = id;
      const slot = state.slots[id];
      document.getElementById("modalTitle").textContent = `#${id} 號禮物`;

      if (state.phase === 1 || forceHintMode) {
        document.getElementById("modalPhase1Fields").classList.remove("hidden");
        document.getElementById("modalPhase3Fields").classList.add("hidden");
        document.getElementById("inputGiver").value = "";
        document.getElementById("inputHint").value = "";
      } else {
        document.getElementById("modalPhase1Fields").classList.add("hidden");
        document.getElementById("modalPhase3Fields").classList.remove("hidden");
        document.getElementById("modalHintPreview").textContent = slot.hint || "無";
        document.getElementById("inputGiverEdit").value = slot.giver || "";
        document.getElementById("inputGiftName").value = slot.gift || "";
      }
      document.getElementById("editModal").classList.remove("hidden");
    };

    document.getElementById("modalSaveBtn").addEventListener("click", () => {
      if (!currentEditId) return;
      const slot = state.slots[currentEditId];
      const isHintMode = !document.getElementById("modalPhase1Fields").classList.contains("hidden");

      if (isHintMode) {
        const giver = document.getElementById("inputGiver").value.trim();
        const hint = document.getElementById("inputHint").value.trim();
        if (!giver || !hint) {
          alert("請填寫「誰送的」和「禮物提示」喔！");
          return;
        }
        slot.assigned = true;
        slot.giver = giver;
        slot.hint = hint;
      } else {
        slot.giver = document.getElementById("inputGiverEdit").value.trim();
        slot.gift = document.getElementById("inputGiftName").value.trim();
      }

      document.getElementById("editModal").classList.add("hidden");
      saveState();
    });

    document.getElementById("modalCloseBtn").addEventListener("click", () => {
      document.getElementById("editModal").classList.add("hidden");
    });

    document.getElementById("drawTicketBtn").addEventListener("click", () => {
      const pool = Object.values(state.slots).filter(s => !s.drawn);
      if (pool.length === 0) {
        alert("籤筒已經全部抽完囉！");
        return;
      }
      const icon = document.getElementById("shakerIcon");
      icon.classList.add("animate-shake");
      setTimeout(() => {
        icon.classList.remove("animate-shake");
        const picked = pool[Math.floor(Math.random() * pool.length)];
        tempCandidateSlotId = picked.id;
        renderAll();
      }, 450);
    });

    document.getElementById("redrawBtn").addEventListener("click", () => {
      if (currentTurnRedrawUsed) return;
      const slotArr = Object.values(state.slots).filter(s => !s.drawn);
      let pool = slotArr.filter(s => s.id !== tempCandidateSlotId);
      if (pool.length === 0) pool = slotArr;

      currentTurnRedrawUsed = true;
      const picked = pool[Math.floor(Math.random() * pool.length)];
      tempCandidateSlotId = picked.id;
      renderAll();
    });

    document.getElementById("confirmTicketBtn").addEventListener("click", () => {
      if (!tempCandidateSlotId) return;
      state.slots[tempCandidateSlotId].drawn = true;
      currentTurnWonId = tempCandidateSlotId;
      tempCandidateSlotId = null;
      saveState();
    });

    document.getElementById("nextPersonDrawBtn").addEventListener("click", () => {
      currentTurnWonId = null;
      tempCandidateSlotId = null;
      currentTurnRedrawUsed = false;
      renderAll();
    });

    window.castVote = function(id) {
      if (!confirm(`確定要把這一票投給 #${id} 號嗎？`)) return;
      state.slots[id].votes = (state.slots[id].votes || 0) + 1;
      saveState();
    };

    document.getElementById("hostTriggerBtn").addEventListener("click", () => {
      const panel = document.getElementById("hostPanel");
      if (!panel.classList.contains("hidden")) {
        panel.classList.add("hidden");
        return;
      }
      document.getElementById("pwdInput").value = "";
      document.getElementById("pwdModal").classList.remove("hidden");
      setTimeout(() => document.getElementById("pwdInput").focus(), 100);
    });

    document.getElementById("pwdCancelBtn").addEventListener("click", () => {
      document.getElementById("pwdModal").classList.add("hidden");
    });

    document.getElementById("pwdConfirmBtn").addEventListener("click", () => {
      if (document.getElementById("pwdInput").value === HOST_PWD) {
        document.getElementById("pwdModal").classList.add("hidden");
        document.getElementById("hostPanel").classList.remove("hidden");
      } else {
        alert("密碼錯誤！");
      }
    });

    document.getElementById("hostCloseBtn").addEventListener("click", () => {
      document.getElementById("hostPanel").classList.add("hidden");
    });

    document.querySelectorAll(".phase-switch-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        state.phase = Number(btn.dataset.setPhase);
        if (state.phase !== 4) state.revealed = false;
        currentTurnWonId = null;
        tempCandidateSlotId = null;
        currentTurnRedrawUsed = false;
        lastWheelWonId = null;
        saveState();
      });
    });

    document.getElementById("revealToggleBtn").addEventListener("click", () => {
      state.phase = 4;
      state.revealed = true;
      saveState();
      if (typeof confetti === "function") {
        confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
      }
    });

    document.getElementById("qrOpenBtn").addEventListener("click", () => {
      const url = window.location.href;
      document.getElementById("qrImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(url)}`;
      document.getElementById("qrModal").classList.remove("hidden");
    });
    document.getElementById("qrCloseBtn").addEventListener("click", () => {
      document.getElementById("qrModal").classList.add("hidden");
    });
    document.getElementById("copyUrlBtn").addEventListener("click", () => {
      navigator.clipboard.writeText(window.location.href);
      alert("網址已複製");
    });

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    loadState();
  </script>
</body>
</html>
